<!doctype html>
<meta charset="utf-8" />
<header>
<h1 style="text-align:center;">Mars Greenhouse System</h1>
<style>
table.centered {
    margin-inline: auto;    /* logical version of margin-left/right:auto */
    justify-content: center;/* horizontal */
  }
</style>
</header>
<body>
<table class="centered" border="1">
     <tr>
        <td>
           <button id="irrigation">Irrigation</button><!-- Button for Irrigation-->
        </td>
        <td>
           <button id="disease">Disease Detection</button><!-- Button for Disease Detection-->
        </td>
        <td>
           <button id="energy">Energy Optimization</button><!-- Button for Energy Optimization-->
        </td>
     </tr>
</table>
<pre id="out"></pre>
<script>
    document.getElementById('irrigation').onclick = async () => {
    //...Irrigation Button Function.....//
    out.textContent = "Loading..."  
    try {
      const res = await fetch('http://127.0.0.1:5000/api/irrigation', {
        method: 'GET',
        headers: {'Accept': 'application/json'}
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      //out.textContent = JSON.stringify(data, null, 2);
      out.textContent = data?.results?.[0]?.generated_text ?? 'generated_text not found';

    } catch (err) {
      out.textContent = 'Error: ' + err.message;
    }
  };
</script>
